name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install ruff
      - run: python -m ruff check .
      - name: Architecture guard (no bpy outside infrastructure/runtime)
        run: python scripts/lint.py

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11"]
    env:
      CHARACTER_ENGINE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e ".[backend,dev,schema]"
      - name: Domain tests (pure Python)
        run: python -m pytest tests/anatomy tests/unit tests/integration tests/export -q
      - name: Backend tests (SQLite in-memory)
        run: python -m pytest tests/backend -q

  export-gltf:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e .
      - name: Export canonical skeleton to glTF
        run: python -m character_engine.export.gltf -o builds/gltf/human_adult_206.glb
      - uses: actions/upload-artifact@v4
        with:
          name: human_adult_206-gltf
          path: builds/gltf/
