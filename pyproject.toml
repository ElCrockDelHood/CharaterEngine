[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "character-engine"
version = "0.1.0"
description = "Canonical, engine-agnostic human character system (anatomy domain, backend, exporters for Blender/UPBGE/Godot)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "CHARACTER ENGINE team" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Operating System :: OS Independent",
]

# Core domain has NO third-party runtime dependencies (pure Python).
dependencies = []

[project.optional-dependencies]
# Backend (identity / auth / authz / events / rewards)
backend = [
    "sqlalchemy>=2.0.0",
    "alembic>=1.12.0",
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "argon2-cffi>=23.1.0",
    "python-multipart>=0.0.6",
    "python-dotenv>=1.0.0",
]
# PostgreSQL driver (production only; not needed for the SQLite test profile)
postgres = ["psycopg2-binary>=2.9.0"]
# Optional strict JSON-schema validation of canonical assets
schema = ["jsonschema>=4.20"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "httpx>=0.25.0",
    "ruff>=0.5",
]

[project.scripts]
ce-export-gltf = "character_engine.export.gltf:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["character_engine*"]

[tool.setuptools.package-data]
"character_engine" = ["data/anatomy/*.json", "data/anatomy/references/*.json", "schema/*.json"]

# --------------------------------------------------------------------------
# pytest
# --------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-ra -p no:cacheprovider"
markers = [
    "backend: backend (SQLite) integration tests",
    "slow: tests that take more than a few seconds",
]
filterwarnings = [
    "error::DeprecationWarning:character_engine.*",
    "error::DeprecationWarning:backend.*",
]

# --------------------------------------------------------------------------
# ruff (lint + format)
# --------------------------------------------------------------------------
[tool.ruff]
line-length = 110
target-version = "py310"
src = ["src", "backend", "tests", "scripts"]
extend-exclude = ["builds", "docs", ".venv*", "*.egg-info"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = [
    "E501",  # line length handled by formatter
    "E741",  # ambiguous single-letter names (math code uses l, v, q)
    "E702",  # multiple statements on one line (matrix literals)
    "E712",  # SQLAlchemy `== True` comparisons are intentional
    "B008",  # function call in default argument (FastAPI Depends style)
    "B904",  # raise-without-from: backend wraps errors deliberately (sanitization)
    "B905",  # zip strict= not required on 3.10 baseline
    # Keep the existing typing style (Optional[...], Dict[...], List[...]).
    "UP006", "UP007", "UP035", "UP045",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011", "B017", "F841"]
"scripts/**" = ["E402"]
"**/__init__.py" = ["F401", "F403"]
"src/character_engine/infrastructure/blender/**" = ["F401", "F841"]

[tool.ruff.lint.isort]
known-first-party = ["character_engine", "backend"]

# --------------------------------------------------------------------------
# coverage
# --------------------------------------------------------------------------
[tool.coverage.run]
source = ["src/character_engine", "backend"]
omit = ["*/__init__.py", "src/character_engine/infrastructure/blender/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
